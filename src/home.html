<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hideout - Home</title>
    <link rel="stylesheet" href="stylesheets/style.css">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <link
        rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
</head>
<body>
    <div id="mapsBox" class="container">
        <div id="searchBox">
            <input id="search-input" placeholder="Find a shady spot..." />
            <button id="search-btn">Search</button>
        </div>
        <div id="map" class="map-container"></div>
        
        <div id="aiResponse">
            <p id="responseText"></p>
        </div>
        
    </div>

    <div id="infoBox" class="container">
        <h2 id="nameBox">Hideout Name</h2>
        <div id="ratingInfo">
            <progress id="rating" value="0" max="10"></progress>
        </div>
        <form id="leaveRatingForm">
            <input type="range" id="ratingInBar" name="ratingInBar" min="1" max="10">
            <input type="button" id="submitRating" value="Rate!">
        </form>

    </div>
    <nav-bar></nav-bar>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <script type="module">
        import { initMap } from "./scripts/mapModule.js";
        initMap({
            containerId: "map",
        });
    </script>
    <script src="scripts/navBarElement.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
