<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hideout — Explore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="stylesheets/style.css" />
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html" class="app-logo">&#x1F333; Hideout</a>
      <span id="header-greeting" class="text-muted small"></span>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="search-bar">
    <div class="container">
      <div class="input-group">
        <span class="input-group-text bg-white border-end-0">&#x1F50D;</span>
        <input id="search-input" class="form-control border-start-0" type="text"
               placeholder='Try "quiet park with lots of trees near Kitsilano"...' />
        <button id="search-btn" class="btn btn-primary">Search</button>
      </div>
    </div>
  </div>

  <!-- AI Response -->
  <div class="container mb-3">
    <div id="aiResponse" class="d-none">
      <div class="d-flex justify-content-between align-items-start">
        <p id="responseText" class="mb-0 small"></p>
        <button id="dismissAi" class="btn-close btn-sm ms-2"></button>
      </div>
    </div>
  </div>

  <!-- View Toggle -->
  <div class="container d-flex justify-content-between align-items-center mb-3">
    <h2 class="h5 mb-0">Shady Spots</h2>
    <div class="btn-group btn-group-sm" role="group">
      <button class="btn btn-outline-primary active" id="btnMapView">Map</button>
      <button class="btn btn-outline-primary" id="btnListView">List</button>
    </div>
  </div>

  <!-- Map -->
  <div class="container mb-3" id="mapContainer">
    <div id="map"></div>
  </div>

  <!-- Sort & Filter (list only) -->
  <div class="container d-flex justify-content-between align-items-center mb-3 d-none" id="sortBar">
    <div></div>
    <div class="dropdown">
      <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button"
              data-bs-toggle="dropdown">Sort by</button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item active" href="#" data-sort="rating">Highest Rated</a></li>
        <li><a class="dropdown-item" href="#" data-sort="name">Name A–Z</a></li>
        <li><a class="dropdown-item" href="#" data-sort="newest">Newest</a></li>
      </ul>
    </div>
  </div>

  <!-- Location Cards -->
  <div class="container d-none" id="locationList">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="text-muted mt-2">Finding shady spots near you...</p>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal fade" id="locationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title" id="modalName"></h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <!-- Shade Meter -->
          <div class="shade-meter mb-3">
            <label class="small text-muted d-flex justify-content-between">
              <span>Shade Level</span>
              <span id="modalShadeLabel">—</span>
            </label>
            <div class="shade-bar">
              <div class="shade-bar-fill" id="modalShadeFill"></div>
            </div>
          </div>
          <div class="row g-2 mb-3" id="modalRatings"></div>
          <div id="modalReviews">
            <h6 class="small text-uppercase text-muted mb-2">Recent Reviews</h6>
            <div id="modalReviewsList"></div>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button id="modalFavBtn" class="btn btn-outline-warning btn-sm">&#x2606; Favorite</button>
          <button id="modalReviewBtn" class="btn btn-primary btn-sm" data-bs-toggle="modal"
                  data-bs-target="#reviewModal">Leave Review</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Review Modal -->
  <div class="modal fade" id="reviewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title">Write a Review</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="reviewForm">
            <input type="hidden" id="reviewLocationId" />
            <div class="mb-3">
              <label class="form-label small">Overall Rating</label>
              <div class="star-rating d-flex gap-1" id="starOverall">
                <button type="button" class="star-btn" data-val="1">&#x2606;</button>
                <button type="button" class="star-btn" data-val="2">&#x2606;</button>
                <button type="button" class="star-btn" data-val="3">&#x2606;</button>
                <button type="button" class="star-btn" data-val="4">&#x2606;</button>
                <button type="button" class="star-btn" data-val="5">&#x2606;</button>
              </div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-4">
                <label class="form-label small">Shade</label>
                <select class="form-select form-select-sm star-select" id="shadeRating">
                  <option value="">—</option><option value="1">1</option><option value="2">2</option>
                  <option value="3">3</option><option value="4">4</option><option value="5">5</option>
                </select>
              </div>
              <div class="col-4">
                <label class="form-label small">Access</label>
                <select class="form-select form-select-sm star-select" id="accessRating">
                  <option value="">—</option><option value="1">1</option><option value="2">2</option>
                  <option value="3">3</option><option value="4">4</option><option value="5">5</option>
                </select>
              </div>
              <div class="col-4">
                <label class="form-label small">Noise</label>
                <select class="form-select form-select-sm star-select" id="noiseRating">
                  <option value="">—</option><option value="1">1</option><option value="2">2</option>
                  <option value="3">3</option><option value="4">4</option><option value="5">5</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small">Comment</label>
              <textarea class="form-control form-control-sm" id="reviewText" rows="3"
                        placeholder="How was the shade? Easy to get to?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit Review</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <nav-bar></nav-bar>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="scripts/navBarElement.js"></script>
  <script type="module">
    import { initMap } from "./scripts/mapModule.js";
    // Store on window so app.js can access it
    window._mapInstance = initMap({ containerId: "map" });
  </script>
  <script src="scripts/app.js"></script>
</body>
</html>
